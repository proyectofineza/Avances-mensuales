<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · Portal de avance de ventas</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0E1217">
  <script>
    // Mismo tema que eligió el usuario dentro del portal (oscuro por defecto).
    try { if (localStorage.getItem('tema') === 'claro') document.documentElement.dataset.tema = 'claro'; } catch (e) { /* sin almacenamiento */ }
  </script>
  <meta name="apple-mobile-web-app-title" content="Ventas Fineza">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
  <main class="login">
    <span class="login-logo-chip"><img class="login-logo" src="img/fineza.png" alt="Fineza"></span>
    <p class="login-sub">Portal de avance de ventas</p>

    <form class="login-card" id="login-form" novalidate>
      <div>
        <h1>Ingresar</h1>
        <p class="muted" style="margin:4px 0 0">Usá tu número de cédula y tu PIN de acceso.</p>
      </div>
      <div>
        <label for="ci">Cédula de identidad</label>
        <input id="ci" name="ci" inputmode="numeric" autocomplete="username" required>
      </div>
      <div>
        <label for="pin">PIN de acceso</label>
        <input id="pin" name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required>
      </div>
      <div class="alert alert-error" id="login-error" hidden></div>
      <button class="btn btn-primary" type="submit" id="login-btn">Ingresar</button>
      <p class="muted small" style="margin:0;text-align:center">¿No tenés usuario? <button class="btn-link" type="button" id="ir-solicitud">Solicitá acceso</button></p>
    </form>

    <form class="login-card" id="solicitud-form" novalidate hidden>
      <div>
        <h1>Solicitar acceso</h1>
        <p class="muted" style="margin:4px 0 0">Completá tus datos. Vas a poder ingresar cuando el administrador apruebe tu solicitud.</p>
      </div>
      <div>
        <label for="sol-ci">Cédula de identidad</label>
        <input id="sol-ci" inputmode="numeric" autocomplete="username" required>
      </div>
      <div>
        <label for="sol-nombre">Nombre y apellido</label>
        <input id="sol-nombre" autocomplete="name" maxlength="80" required>
      </div>
      <div>
        <label for="sol-pin">Elegí un PIN (4 a 6 números)</label>
        <input id="sol-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" required>
      </div>
      <div>
        <label for="sol-pin2">Repetí el PIN</label>
        <input id="sol-pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password" required>
      </div>
      <div class="alert" id="sol-msg" hidden></div>
      <button class="btn btn-primary" type="submit" id="sol-btn">Enviar solicitud</button>
      <p class="muted small" style="margin:0;text-align:center"><button class="btn-link" type="button" id="ir-login">Volver a ingresar</button></p>
    </form>

    <p class="unidades-title">NUESTRAS UNIDADES DE NEGOCIO</p>
    <div class="unidades-logos">
      <img src="img/baratote.png" alt="Baratote" style="height:24px">
      <img src="img/fineglass.png" alt="Fine Glass Solutions" style="height:44px">
      <img src="img/fineboats.png" alt="Fine Boats" style="height:48px">
    </div>
  </main>

  <script type="module">
    import { login, me, solicitarAcceso } from './js/api.js';

    const form = document.getElementById('login-form');
    const ci = document.getElementById('ci');
    const pin = document.getElementById('pin');
    const error = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    // Si llegó desde un link a una sección (por ejemplo el aviso de Teams), vuelve a esa sección.
    const pedida = ['dashboard', 'sucursales', 'ventas', 'usuarios'].find((v) => location.hash === `#${v}`);
    const destino = (rol) => (pedida ? `app.html#${pedida}` : rol === 'admin' ? 'app.html#ventas' : 'app.html#dashboard');

    me().then((u) => location.replace(destino(u.rol))).catch(() => {});

    const soloDigitos = (el) => el.addEventListener('input', () => { el.value = el.value.replace(/\D/g, ''); });
    soloDigitos(ci);
    soloDigitos(pin);

    // Solicitud de acceso
    const solForm = document.getElementById('solicitud-form');
    const solMsg = document.getElementById('sol-msg');
    const solBtn = document.getElementById('sol-btn');
    const campo = (id) => document.getElementById(id);
    ['sol-ci', 'sol-pin', 'sol-pin2'].forEach((id) => soloDigitos(campo(id)));

    const mostrar = (cual) => {
      form.hidden = cual !== 'login';
      solForm.hidden = cual !== 'solicitud';
      error.hidden = true;
      solMsg.hidden = true;
      (cual === 'login' ? ci : campo('sol-ci')).focus();
    };
    campo('ir-solicitud').addEventListener('click', () => mostrar('solicitud'));
    campo('ir-login').addEventListener('click', () => mostrar('login'));

    const solAviso = (texto, ok) => {
      solMsg.textContent = texto;
      solMsg.className = `alert ${ok ? 'alert-ok' : 'alert-error'}`;
      solMsg.hidden = false;
    };

    solForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const datos = { ci: campo('sol-ci').value, nombre: campo('sol-nombre').value.trim(), pin: campo('sol-pin').value };
      if (datos.ci.length < 5) return solAviso('La cédula debe tener al menos 5 dígitos.', false);
      if (!datos.nombre) return solAviso('Indicá tu nombre y apellido.', false);
      if (!/^\d{4,6}$/.test(datos.pin)) return solAviso('El PIN debe tener de 4 a 6 dígitos.', false);
      if (datos.pin !== campo('sol-pin2').value) return solAviso('Los dos PIN no coinciden.', false);
      solBtn.disabled = true;
      try {
        const res = await solicitarAcceso(datos);
        solForm.reset();
        solAviso(res.mensaje, true);
      } catch (err) {
        solAviso(err.message, false);
      } finally {
        solBtn.disabled = false;
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      if (!ci.value || !/^\d{4,6}$/.test(pin.value)) {
        error.textContent = 'Cédula o PIN incorrectos.';
        error.hidden = false;
        return;
      }
      btn.disabled = true;
      try {
        const u = await login(ci.value, pin.value);
        location.replace(destino(u.rol));
      } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
        pin.value = '';
        pin.focus();
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
